<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Técnico Brasil — Gerenciador de Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f2;--panel:#ffffff;--panel-2:#e8eeea;--line:#d1d9d5;--txt:#18221f;
    --dim:#65736f;--accent:#4b9a72;--accent-strong:#286748;--accent-soft:#dceee2;
    --danger:#d9675f;--warning:#c6973f;--ok:#438f68;--row:#f7f9f7;--sidebar:#0b111a;
    --sidebar-text:#e7e9e4;--shadow:0 18px 48px rgba(8,14,23,.09);
  }
  html[data-tema="escuro"]{
    --bg:#080e17;--panel:#101824;--panel-2:#172230;--line:#273342;--txt:#f1f0e8;
    --dim:#99a7b5;--accent:#59a77d;--accent-strong:#246343;--accent-soft:#e2bd5b;
    --danger:#f27b70;--warning:#e2bd5b;--ok:#6cbd8c;--row:#121d2a;--sidebar:#070c13;
    --sidebar-text:#e7e8e2;--shadow:0 24px 70px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box}
  html{min-height:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:"DM Sans",sans-serif;font-size:15px;letter-spacing:0}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:180px 120px;mask-image:linear-gradient(to bottom,black,transparent 74%)}
  header{position:fixed;inset:0 auto 0 0;z-index:10;width:248px;background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}
  body:not(.game-active) header{position:relative;width:100%;height:72px;padding:0 28px;border-right:0;border-bottom:1px solid var(--line);display:block}
  .topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  body:not(.game-active) .topo{height:100%}
  .marca{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;color:var(--sidebar-text)}
  .marca::before{content:"TB";display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-strong);font-size:13px}
  #hdInfo{display:block;width:100%;padding:18px 8px 12px;margin-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:1.65}
  body:not(.game-active) #hdInfo{display:none}
  .esc{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  body:not(.game-active) .esc{margin:0 0 0 auto}
  nav{display:flex;flex-direction:column;gap:4px;margin-top:12px;flex:1}
  nav button{width:100%;justify-content:flex-start;text-align:left;border-color:transparent;background:transparent;color:var(--sidebar-text)}
  nav button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:10px}
  nav button.on::before{background:var(--accent-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
  main{position:relative;padding:30px;max-width:1440px;margin:0 auto 0 248px;min-height:100vh}
  body:not(.game-active) main{margin:0 auto;max-width:1120px;padding:48px 24px 64px;min-height:calc(100vh - 72px);display:flex;align-items:flex-start}
  button{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px "DM Sans",sans-serif;cursor:pointer;background:var(--panel-2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:10px 15px;min-height:42px;transition:background .18s,border-color .18s,transform .18s,color .18s}
  button:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  button:active{transform:translateY(1px)}
  button.pri,button.on{background:var(--accent-strong);color:var(--accent-soft);border-color:var(--accent);font-weight:700}
  button.peq{padding:7px 10px;min-height:36px;font-size:13px}
  button:disabled{opacity:.38;cursor:not-allowed}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
  h1,h2,h3,h4{font-family:"Barlow Condensed","Space Grotesk",sans-serif;letter-spacing:0;margin:0 0 12px}
  h1{font-size:clamp(28px,4vw,44px);line-height:1.05}h2{font-size:23px}h3{font-size:17px}h4{font-size:13px;text-transform:uppercase}
  p{line-height:1.55}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{cursor:pointer;color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:700}
  tbody tr{background:transparent;transition:background .18s}tbody tr:nth-child(odd){background:color-mix(in srgb,var(--row) 65%,transparent)}tbody tr:hover{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
  .rol{overflow-x:auto;scrollbar-color:var(--accent) var(--panel-2)}
  .pill{display:inline-grid;place-items:center;min-width:42px;padding:5px 8px;margin-right:10px;border-radius:5px;font:700 11px "Space Grotesk",sans-serif;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .dim{color:var(--dim)}.num{text-align:right;font-variant-numeric:tabular-nums}.neg{color:var(--danger);font-weight:700}
  .campo-wrapper{position:relative;width:100%;max-width:840px;margin:0 auto 16px;background:#207043;border:3px solid #14492c;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  #campo2d{display:block;width:100%;height:auto;aspect-ratio:840/520}
  .placar{font:700 clamp(48px,9vw,92px) "Space Grotesk",sans-serif;text-align:center;margin:16px 0;color:var(--accent-soft)}
  .narra{height:340px;overflow-y:auto;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:14px;line-height:1.65}
  .narra div{padding:8px 0;border-bottom:1px dashed var(--line)}.min{display:inline-block;width:42px;font-weight:700;color:var(--accent)}
  .g{color:var(--ok);font-weight:700}.r{color:var(--danger);font-weight:700}.esq{display:grid;gap:7px}
  .lin{display:flex;gap:9px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:14px;cursor:pointer;transition:border-color .18s,transform .18s}
  .lin:hover{border-color:var(--accent);transform:translateX(2px)}.lin b{min-width:42px}.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .zt{box-shadow:inset 4px 0 0 var(--accent)}.zl{box-shadow:inset 4px 0 0 #4b8cc7}.zr{box-shadow:inset 4px 0 0 var(--danger)}
  .legenda{font-size:12px;color:var(--dim);margin-top:10px}.barra{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.barra i{display:block;height:100%;background:var(--accent)}
  .aviso{background:color-mix(in srgb,var(--danger) 16%,var(--panel));color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 42%,var(--line));border-radius:6px;padding:12px;font-weight:700}
  .hero-escolha{width:100%;overflow:hidden;padding:0}.hero-escolha .intro{padding:34px 36px 26px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 68%)}
  body.game-home header{height:82px;padding:0 34px;background:var(--sidebar);border-bottom-color:var(--accent-strong)}
  body.game-home .topo{height:100%;flex-wrap:nowrap}
  body.game-home .marca{font:700 21px "Barlow Condensed",sans-serif}
  body.game-home main{display:block;width:100%;max-width:1280px;padding:0 32px 24px;min-height:calc(100vh - 82px)}
  body.game-home .esc{align-items:center}
  body.game-home .esc button:first-child{padding-right:20px;padding-left:20px}
  body.game-home .esc button:last-child{width:38px;padding:0;font-size:18px}
  .home-landing{width:100%;margin:0 auto}
  .home-hero{min-height:500px;padding:54px 0 44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
  .home-eyebrow{display:flex;align-items:center;gap:14px;color:var(--dim);font:600 11px "Space Grotesk",sans-serif;letter-spacing:.12em;text-transform:uppercase}
  .home-eyebrow::before{content:"";width:42px;height:1px;background:var(--accent)}
  .home-title{max-width:900px;margin:28px 0 20px;font:700 88px/.9 "Barlow Condensed",sans-serif;text-transform:uppercase}
  .home-title span{color:var(--warning)}
  .home-lead{max-width:600px;margin:0 0 30px;color:var(--dim);font:24px/1.5 Georgia,serif}
  .home-actions{display:flex;gap:12px;flex-wrap:wrap}
  .home-actions button{min-height:56px;padding:0 23px;font-size:15px}
  .home-actions .home-start{background:var(--accent-strong);color:var(--txt);border-color:var(--accent);font-weight:700}
  .home-actions .home-start:hover{background:color-mix(in srgb,var(--accent) 34%,var(--accent-strong))}
  .home-actions .home-start span{font-size:19px}
  .home-footnote{margin:20px 0 0;color:var(--dim);font:12px "Space Grotesk",sans-serif}
  .home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .home-stat{padding:18px 20px;border-right:1px solid var(--line)}
  .home-stat:first-child{padding-left:0}.home-stat:last-child{border-right:0}
  .home-stat strong{display:block;color:var(--txt);font:700 28px "Barlow Condensed",sans-serif}
  .home-stat span{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .home-next{display:grid;grid-template-columns:minmax(0,.8fr) minmax(260px,1fr);gap:34px;margin-top:42px;padding-top:28px;border-top:1px solid var(--line)}
  .home-next .eyebrow{margin:0 0 8px}
  .home-next h2{max-width:460px;margin:0;font-size:34px;line-height:1}
  .home-next p{max-width:540px;margin:3px 0 0;color:var(--dim);font:17px/1.55 Georgia,serif}
  .home-hero{animation:home-arrive .65s ease-out both}
  @keyframes home-arrive{from{opacity:0}to{opacity:1}}
  @media(max-width:1280px){.home-title{font-size:68px}}
  .eyebrow{display:block;margin-bottom:9px;color:var(--accent);font:700 11px "Space Grotesk",sans-serif;text-transform:uppercase}.hero-escolha .intro p{max-width:660px;margin:0;color:var(--dim)}
  .liga-badge{float:right;margin-top:-54px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--row);font-size:12px}.liga-badge b{display:block;color:var(--dim);font-size:9px;text-transform:uppercase}
  .clubes-table td{height:61px}.clubes-table tbody tr:hover td:first-child{color:var(--accent)}.clubes-table button{min-width:90px}.escolha-actions{display:flex;gap:8px;flex-wrap:wrap;padding:18px 24px;background:var(--row);border-top:1px solid var(--line)}
  .statusbar{display:flex;gap:16px;padding:12px 24px;border-top:1px solid var(--line);color:var(--dim);font-size:10px;text-transform:uppercase}.statusbar span:last-child{margin-left:auto}.statusbar i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--ok)}
  .premium-lock{display:inline-block;margin-left:8px;padding:3px 6px;border:1px solid var(--warning);border-radius:4px;color:var(--warning);font-size:9px;font-weight:700;text-transform:uppercase}.plano-note{padding:13px 24px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}.plano-note b{color:var(--accent)}
  .kicker{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase}.metric{font:700 28px "Space Grotesk",sans-serif}.partida-destaque{min-height:230px;display:flex;flex-direction:column;justify-content:center}.matchup{font:700 clamp(21px,3vw,32px) "Space Grotesk",sans-serif;margin:12px 0 8px}.toast{position:fixed;right:22px;bottom:22px;z-index:30;max-width:360px;padding:12px 16px;border-radius:6px;background:var(--accent-soft);color:#10251b;font-weight:700;box-shadow:var(--shadow)}
  @media(max-width:760px){
    body.game-active{padding-bottom:72px}header,body.game-active header{position:fixed;inset:auto 0 0 0;width:100%;height:72px;padding:7px 8px;border:0;border-top:1px solid var(--line);display:block}.game-active .topo{display:none}nav{height:100%;margin:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}nav button{min-width:0;height:58px;padding:4px 2px;justify-content:center;text-align:center;font-size:10px;flex-direction:column}nav button::before{margin:0;width:6px;height:6px}main,body.game-active main{margin:0;padding:18px 12px;min-height:100vh}body:not(.game-active) header{height:64px;padding:0 10px}.marca{font-size:13px}.marca::before{width:32px;height:32px}.esc{gap:4px}.esc button{width:34px;padding:5px;font-size:0}.esc button::after{font-size:15px}.esc button:nth-child(1)::after{content:"↓"}.esc button:nth-child(2)::after{content:"↑"}.esc button:nth-child(3)::after{content:"◐"}body:not(.game-active) main{padding:18px 10px;min-height:auto}.card{padding:16px}.hero-escolha .intro{padding:24px 18px 20px}.liga-badge{float:none;margin:18px 0 0;display:inline-block}.clubes-table thead{display:none}.clubes-table tbody{display:block}.clubes-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:12px 10px;border-bottom:1px solid var(--line)}.clubes-table td{height:auto;padding:0;border:0;white-space:normal}.clubes-table td:nth-child(1){font-weight:600}.clubes-table td:nth-child(2),.clubes-table td:nth-child(4){display:none}.clubes-table td:nth-child(3){grid-column:1;color:var(--dim);font-size:12px;text-align:left}.clubes-table td:nth-child(3)::before{content:"Caixa: ";}.clubes-table td:nth-child(5){grid-column:2;grid-row:1/3;align-self:center}.clubes-table .pill{min-width:34px;margin-right:6px}.clubes-table button{min-width:74px;padding:7px;font-size:12px}.statusbar{display:none}.grid{grid-template-columns:1fr}.toast{left:12px;right:12px;bottom:84px}.placar{font-size:54px}}
  @media(max-width:760px){
    body.game-home header{height:64px;padding:0 12px}
    body.game-home .marca{font-size:15px}
    body.game-home main{padding:0 18px 28px;min-height:calc(100vh - 64px)}
    body.game-home .esc button{width:auto;min-height:36px;padding:7px 10px;font-size:12px}
    body.game-home .esc button::after{content:none!important}
    body.game-home .esc button:first-child{padding-right:12px;padding-left:12px}
    body.game-home .esc button:last-child{width:36px;padding:0;font-size:17px}
    .home-hero{min-height:0;padding:56px 0 38px}
    .home-title{margin:22px 0 16px;font-size:52px;line-height:.94}
    .home-lead{font-size:18px}
    .home-actions{width:100%;max-width:380px;flex-direction:column;align-items:stretch}
    .home-actions button{width:100%}
    .home-footnote{font-size:11px}
    .home-stat{padding:14px 10px}
    .home-stat strong{font-size:23px}
    .home-stat span{font-size:9px;letter-spacing:0}
    .home-next{grid-template-columns:1fr;gap:8px;margin-top:30px;padding-top:22px}
    .home-next h2{font-size:30px}
    .home-next p{font-size:16px}
  }
  @media(max-width:420px){.home-title{font-size:44px}.home-eyebrow{font-size:9px;letter-spacing:.08em}.home-stat{padding-right:6px;padding-left:6px}}
  @media(prefers-reduced-motion:reduce){.home-hero{animation:none}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="topo">
    <span class="marca">Técnico Brasil</span>
    <span id="hdInfo" class="dim"></span>
    <span class="esc" id="headerActions">
      <button class="peq" onclick="salvarJogo()" title="Salvar jogo">Salvar</button>
      <button class="peq" onclick="carregarJogo()" title="Carregar jogo">Carregar</button>
      <button class="peq" onclick="trocarTema()" title="Alternar tema">Tema</button>
    </span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main><div id="toast" aria-live="polite"></div>

<script>
/* =========================================================================
   TÉCNICO BRASIL — jogo de gerenciamento de futebol (arquivo único)
   Organização: 1) utilidades  2) geração de dados  3) escalação/força
   4) simulação de partida  5) campeonato/finanças  6) interface
   ========================================================================= */

/* ---------------------------------------------------------------- 1) UTIL */
const CHAVE_SAVE = "tecnico-brasil-v1";
const PLANO = new URLSearchParams(location.search).get("plano") === "premium" ? "premium" : "free";
let J = null;          // objeto único de estado do jogo
let tela = "inicio";   // tela atual
let ui = {};           // estado temporário da interface (ordenação, seleção...)
let divisaoSelecionada = "A";

const rnd  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;       // inteiro [a,b]
const sort = arr => arr[Math.floor(Math.random()*arr.length)];    // item aleatório
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dinheiro = v => (v<0?"-":"") + "R$ " + Math.abs(Math.round(v)).toLocaleString("pt-BR");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* -------------------------------------------------- 2) GERAÇÃO DE DADOS */
const NOMES = ["Adilson","Ailton","Alisson","Anderson","Bruno","Caio","Cleber","Danilo",
 "Denilson","Diego","Edinho","Éder","Elton","Emerson","Fábio","Felipe","Gabriel","Geraldo",
 "Gilmar","Guilherme","Heitor","Hélio","Igor","Ivan","Jadson","Jonas","Juninho","Kléber",
 "Lucas","Luan","Maicon","Marcelo","Mateus","Murilo","Nilton","Otávio","Paulinho","Pedro",
 "Rafael","Renan","Ricardo","Robson","Rodrigo","Samuel","Thiago","Tiago","Válter","Vinícius",
 "Wagner","Washington","Wesley","Yuri","Zeca","Arthur","Breno","Cauã","Davi","Enzo","Erick"];
const SOBRE = ["Almeida","Alves","Andrade","Aragão","Barbosa","Barreto","Batista","Bezerra",
 "Braga","Cardoso","Carvalho","Coelho","Correia","Costa","Cunha","Dias","Duarte","Farias",
 "Fernandes","Ferreira","Fonseca","Freitas","Gomes","Gonçalves","Guimarães","Lima","Lopes",
 "Macedo","Machado","Maia","Marques","Martins","Medeiros","Melo","Mendes","Moraes","Moreira",
 "Nascimento","Neves","Nogueira","Oliveira","Pacheco","Pereira","Pinto","Queiroz","Ramos",
 "Rezende","Ribeiro","Rocha","Rodrigues","Sampaio","Santana","Santos","Silva","Siqueira",
 "Sousa","Tavares","Teixeira","Vasconcelos","Vieira","Xavier"];

/** Gera um nome brasileiro fictício. */
function gerarNome(){ return sort(NOMES) + " " + sort(SOBRE); }

// Clubes reais: nome, sigla, cor e "tamanho" (1 pequeno a 5 gigante)
const DIVISOES = {
  A: [
    ["Flamengo","FLA","#c8102e",5],["Palmeiras","PAL","#006437",5],
    ["Corinthians","COR","#111111",5],["São Paulo","SAO","#e30613",5],
    ["Santos","SAN","#111111",4],["Fluminense","FLU","#7b1e3a",5],
    ["Botafogo","BOT","#111111",5],["Vasco da Gama","VAS","#111111",4],
    ["Atlético-MG","CAM","#111111",5],["Cruzeiro","CRU","#003da5",4],
    ["Grêmio","GRE","#0099cc",4],["Internacional","INT","#d71920",4],
    ["Bahia","BAH","#0062a8",3],["Fortaleza","FOR","#005ca9",3],
    ["Ceará","CEA","#111111",3],["Sport","SPT","#e30613",3],
    ["Vitória","VIT","#e30613",3],["Bragantino","RBB","#e30613",3],
    ["Juventude","JUV","#0b7a3b",2],["Mirassol","MIR","#f4c300",2]
  ],
  B: [
    ["América-MG","AME","#006633",4],["Avaí","AVA","#005ca9",3],
    ["Botafogo-SP","BSP","#111111",3],["Chapecoense","CHA","#00843d",3],
    ["Criciúma","CRI","#f5c400",3],["Cuiabá","CUI","#f4c300",3],
    ["Goiás","GOI","#00843d",4],["Novorizontino","NOV","#f4c300",3],
    ["Operário-PR","OPE","#111111",3],["Ponte Preta","PON","#111111",3],
    ["Remo","REM","#003da5",3],["Vila Nova","VNO","#e30613",3],
    ["Volta Redonda","VOL","#f4c300",2],["Paysandu","PAY","#005ca9",3],
    ["CRB","CRB","#e30613",2],["Ferroviária","FER","#e30613",2],
    ["Athletic Club","ATH","#111111",2],["Amazonas","AMA","#f4c300",2],
    ["São Bernardo","SAB","#f4c300",2],["Náutico","NAU","#e30613",2]
  ]
};

// Quantidade de jogadores por posição num elenco de 22
const ELENCO_BASE = {GOL:3, ZAG:5, LAT:4, VOL:4, MEI:3, ATA:3};
const POSICOES = ["GOL","ZAG","LAT","VOL","MEI","ATA"];

/** Salário mensal a partir da força e idade. */
function calcSalario(ovr, idade){
  const base = Math.pow(ovr/10, 3.1) * 55;
  const fatorIdade = idade<21 ? 0.7 : idade>33 ? 0.8 : 1;
  return Math.round(base*fatorIdade/100)*100;
}
/** Valor de mercado a partir da força e idade. */
function calcValor(ovr, idade){
  const base = Math.pow(ovr/10, 4.1) * 900;
  const pico = 1 - Math.abs(26-idade)*0.045;
  return Math.max(30000, Math.round(base*clamp(pico,0.3,1)/1000)*1000);
}

/** Cria um jogador com força em torno de `nivel`. */
function gerarJogador(pos, nivel){
  const ovr = clamp(Math.round(nivel + rnd(-9,9)), 40, 90);
  const idade = rnd(17,38);
  return {
    id: "p"+(J.seq++), nome: gerarNome(), pos, idade, ovr,
    sal: calcSalario(ovr, idade), val: calcValor(ovr, idade),
    amarelos:0, susp:0, lesao:0, jogos:0, gols:0
  };
}

/** Cria os 20 times com 22 jogadores cada. */
function gerarTimes(divisao = divisaoSelecionada){
  return DIVISOES[divisao].map(([nome,sigla,cor,tam], i)=>{
    const nivel = 52 + tam*5;               // times maiores têm elenco melhor
    const t = {
      id:i, nome, sigla, cor, tam,
      cash: 3_000_000 + tam*4_500_000 + rnd(-800000,800000),
      formacao:"4-4-2", titulares:[], reservas:[], jogadores:[],
      pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0
    };
    for(const pos of POSICOES)
      for(let k=0;k<ELENCO_BASE[pos];k++) t.jogadores.push(gerarJogador(pos, nivel));
    return t;
  });
}

/* ------------------------------------------- 3) ESCALAÇÃO E FORÇA */
const FORMACOES = {
  "4-4-2":   {GOL:1, ZAG:2, LAT:2, VOL:2, MEI:2, ATA:2},
  "4-3-3":   {GOL:1, ZAG:2, LAT:2, VOL:2, MEI:1, ATA:3},
  "3-5-2":   {GOL:1, ZAG:3, LAT:2, VOL:2, MEI:1, ATA:2},
  "4-2-3-1": {GOL:1, ZAG:2, LAT:2, VOL:2, MEI:3, ATA:1},
  "4-1-4-1": {GOL:1, ZAG:2, LAT:2, VOL:1, MEI:4, ATA:1},
  "3-4-3":   {GOL:1, ZAG:3, LAT:2, VOL:1, MEI:1, ATA:3},
  "4-5-1":   {GOL:1, ZAG:2, LAT:2, VOL:3, MEI:2, ATA:1},
  "5-3-2":   {GOL:1, ZAG:3, LAT:2, VOL:2, MEI:1, ATA:2},
  "4-2-4":   {GOL:1, ZAG:2, LAT:2, VOL:1, MEI:1, ATA:4}
};
// Pequenos bônus/penalidades por setor conforme a formação
const EFEITO_FORM = {
  "4-4-2":   {def:1.00, mei:1.00, ata:1.00},
  "4-3-3":   {def:0.95, mei:0.98, ata:1.10},
  "3-5-2":   {def:0.93, mei:1.10, ata:1.00},
  "4-2-3-1": {def:0.98, mei:1.08, ata:1.02},
  "4-1-4-1": {def:1.02, mei:1.08, ata:0.96},
  "3-4-3":   {def:0.88, mei:1.00, ata:1.18},
  "4-5-1":   {def:1.10, mei:1.04, ata:0.86},
  "5-3-2":   {def:1.15, mei:0.95, ata:0.92},
  "4-2-4":   {def:0.85, mei:0.90, ata:1.24}
};

const jog = (t,id) => t.jogadores.find(p=>p.id===id);
const apto = p => p.susp===0 && p.lesao===0;

/** Monta a melhor escalação possível respeitando a formação. */
function escalarAuto(t){
  const need = FORMACOES[t.formacao];
  const livres = t.jogadores.filter(apto).sort((a,b)=>b.ovr-a.ovr);
  const usados = new Set(); const tit = [];
  for(const pos of POSICOES){
    let falta = need[pos];
    for(const p of livres){
      if(falta<=0) break;
      if(!usados.has(p.id) && p.pos===pos){ usados.add(p.id); tit.push(p.id); falta--; }
    }
    // se faltar gente na posição, completa com o melhor disponível
    for(const p of livres){
      if(falta<=0) break;
      if(!usados.has(p.id)){ usados.add(p.id); tit.push(p.id); falta--; }
    }
  }
  t.titulares = tit;
  t.reservas = livres.filter(p=>!usados.has(p.id)).map(p=>p.id).slice(0,7);
}

/** Garante que a escalação é válida (11 aptos); recompõe se preciso. */
function validarEscalacao(t){
  const ok = t.titulares.length===11 &&
    t.titulares.every(id=>{ const p=jog(t,id); return p && apto(p); });
  if(!ok) escalarAuto(t);
}

/** Força média de um setor dos titulares. */
function forcaSetor(t, setor){
  const grupos = {def:["GOL","ZAG","LAT"], mei:["VOL","MEI"], ata:["ATA"]};
  const ps = t.titulares.map(id=>jog(t,id)).filter(p=>p && grupos[setor].includes(p.pos));
  if(!ps.length) return 45;
  const m = ps.reduce((s,p)=>s+p.ovr,0)/ps.length;
  return m * EFEITO_FORM[t.formacao][setor];
}
/** Força geral do time escalado. */
function forcaTime(t){
  return forcaSetor(t,"def")*0.38 + forcaSetor(t,"mei")*0.32 + forcaSetor(t,"ata")*0.30;
}
/** Força média de todo o elenco (usada na tela de escolha). */
const forcaElenco = t => t.jogadores.reduce((s,p)=>s+p.ovr,0)/t.jogadores.length;

/* ------------------------------------------ 4) SIMULAÇÃO DE PARTIDA */
const MANDO = 3.2; // bônus de força para o mandante

/** Escolhe quem marcou o gol, com peso por posição. */
function sorteiaGoleador(t){
  const peso = {ATA:6,MEI:3.5,VOL:1.5,LAT:1,ZAG:1,GOL:0.02};
  const ps = t.titulares.map(id=>jog(t,id)).filter(Boolean);
  let total = ps.reduce((s,p)=>s+peso[p.pos],0), r = Math.random()*total;
  for(const p of ps){ r -= peso[p.pos]; if(r<=0) return p; }
  return ps[0];
}
/** Sorteia um jogador de linha (para cartão/lesão). */
function sorteiaLinha(t){
  const ps = t.titulares.map(id=>jog(t,id)).filter(p=>p && p.pos!=="GOL");
  return sort(ps);
}

/**
 * Gera os lances de um trecho da partida (minuto `ini` a `fim`).
 * Retorna lista de eventos {min, txt, tipo, lado}.
 */
function gerarLances(A, B, ini, fim){
  const ev = [];
  const amarelosPrevistos = new Map();
  const fA = forcaTime(A)+MANDO, fB = forcaTime(B);
  for(let m=ini;m<=fim;m++){
    if(Math.random() > 0.155) continue;             // minuto sem lance
    const casa = Math.random() < fA/(fA+fB);
    const at = casa?A:B, df = casa?B:A, lado = casa?"A":"B";
    const r = Math.random();
    if(r < 0.62){                                   // chance de gol
      const pAta = forcaSetor(at,"ata")*1.05, pDef = forcaSetor(df,"def");
      const pGol = 0.30 * (pAta/(pAta+pDef));
      if(Math.random() < pGol){
        const g = sorteiaGoleador(at);
        ev.push({min:m,tipo:"gol",lado,jogadorId:g.id,
          txt:`<b class="g">GOL do ${at.nome}!</b> ${g.nome} (${g.pos}) balança a rede.`});
      } else {
        ev.push({min:m,tipo:"chance",lado,
          txt:`${at.nome} chega com perigo, mas ${sort(["o goleiro salva","a bola vai para fora","a zaga corta"])}.`});
      }
    } else if(r < 0.84){                            // cartão
      const p = sorteiaLinha(at);
      if(!p) continue;
      if(Math.random() < 0.08){
        ev.push({min:m,tipo:"vermelho",lado,jogadorId:p.id,
          txt:`<b class="r">CARTÃO VERMELHO</b> para ${p.nome} (${at.nome}). Fica fora da próxima rodada.`});
      } else {
        const cartoesPrevistos = (amarelosPrevistos.get(p.id)||0)+1;
        amarelosPrevistos.set(p.id,cartoesPrevistos);
        const suspender = (p.amarelos+cartoesPrevistos)%3===0;
        let extra = "";
        if(suspender) extra = " Completa 3 amarelos e está suspenso.";
        ev.push({min:m,tipo:"amarelo",lado,jogadorId:p.id,suspender,
          txt:`Cartão amarelo para ${p.nome} (${at.nome}).${extra}`});
      }
    } else if(r < 0.92){                            // lesão
      const p = sorteiaLinha(at);
      if(!p) continue;
      const duracao = rnd(1,4);
      ev.push({min:m,tipo:"lesao",lado,jogadorId:p.id,duracao,
        txt:`<b class="r">Lesão:</b> ${p.nome} (${at.nome}) sente e deve ficar fora por ${duracao} rodada(s).`});
    } else {
      ev.push({min:m,tipo:"neutro",lado,
        txt:`${at.nome} troca passes e ${sort(["pressiona no campo adversário","tenta abrir pelos lados","segura a posse de bola"])}.`});
    }
  }
  return ev;
}

function aplicarLance(evento){
  if(evento.tipo==="gol") P.placar[evento.lado]++;
  if(typeof campoNotificarEvento === "function") campoNotificarEvento(evento);
  if(!evento.jogadorId) return;
  const time = evento.lado==="A" ? P.A : P.B;
  const jogador = jog(time,evento.jogadorId);
  if(!jogador) return;
  if(evento.tipo==="gol") jogador.gols++;
  else if(evento.tipo==="vermelho"){
    jogador.susp=1; jogador.cartaoVermelho=true;
  }else if(evento.tipo==="amarelo"){
    jogador.amarelos++;
    if(evento.suspender) jogador.susp=1;
  }else if(evento.tipo==="lesao") jogador.lesao=evento.duracao;
}

/** Simula rapidamente uma partida entre dois times (sem narração). */
function simularRapido(A, B){
  validarEscalacao(A); validarEscalacao(B);
  const fA = forcaTime(A)+MANDO, fB = forcaTime(B);
  const golsDe = (f,o) => {
    const lam = clamp(1.35 * Math.pow(f/o, 2.2), 0.25, 4.2);
    let g=0; for(let i=0;i<6;i++) if(Math.random() < lam/6) g++;
    return g;
  };
  return [golsDe(fA,fB), golsDe(fB,fA)];
}

/* --------------------------------------- 5) CAMPEONATO E FINANÇAS */
/** Tabela de 38 rodadas (ida e volta) pelo método do círculo. */
function gerarTabela(nTimes){
  const ids = [...Array(nTimes).keys()];
  const rodadas = [];
  const n = nTimes, meio = n/2;
  let lista = ids.slice();
  for(let r=0;r<n-1;r++){
    const jogos = [];
    for(let i=0;i<meio;i++){
      const a = lista[i], b = lista[n-1-i];
      jogos.push(r%2===0 ? [a,b] : [b,a]);
    }
    rodadas.push(jogos);
    lista = [lista[0], lista[n-1], ...lista.slice(1,n-1)];
  }
  const volta = rodadas.map(j=>j.map(([a,b])=>[b,a]));
  return rodadas.concat(volta);
}

/** Inicia um novo jogo escolhendo o time do usuário. */
function novoJogo(divisao = divisaoSelecionada){
  divisaoSelecionada = divisao;
  J = { seq:1, temporada:2026, rodada:0, meuTime:null, times:[], tabela:[],
    resultados:[], caixaHist:[], fimTemporada:false, log:[], divisao };
  J.times = gerarTimes(divisao);
  J.tabela = gerarTabela(20);
  J.times.forEach(escalarAuto);
}

/** Classificação ordenada. */
function classificacao(){
  return J.times.slice().sort((a,b)=>
    b.pts-a.pts || (b.v-a.v) || ((b.gp-b.gc)-(a.gp-a.gc)) || (b.gp-a.gp) ||
    a.nome.localeCompare(b.nome));
}
const posicaoDe = id => classificacao().findIndex(t=>t.id===id)+1;

/** Aplica um resultado na tabela de classificação. */
function aplicarResultado(A,B,gA,gB){
  A.j++;B.j++;A.gp+=gA;A.gc+=gB;B.gp+=gB;B.gc+=gA;
  if(gA>gB){A.v++;A.pts+=3;B.d++;}
  else if(gB>gA){B.v++;B.pts+=3;A.d++;}
  else {A.e++;B.e++;A.pts++;B.pts++;}
  A.titulares.forEach(id=>{const p=jog(A,id); if(p) p.jogos++;});
  B.titulares.forEach(id=>{const p=jog(B,id); if(p) p.jogos++;});
}

/** Receita de bilheteria do mandante. */
const bilheteria = t => 180000 + t.tam*220000 + rnd(-40000,90000);

/** Desconta salários e credita bilheteria ao fim da rodada. */
function fecharRodadaFinanceiro(jogos){
  for(const [ca,fo] of jogos){
    const A = J.times[ca], B = J.times[fo];
    const folhaA = A.jogadores.reduce((s,p)=>s+p.sal,0)/4;   // salário semanal
    const folhaB = B.jogadores.reduce((s,p)=>s+p.sal,0)/4;
    const renda = bilheteria(A);
    A.cash += renda - folhaA;
    B.cash -= folhaB;
    if(A.id===J.meuTime) J.ultRenda = renda;
    if(A.id===J.meuTime||B.id===J.meuTime) J.ultFolha = A.id===J.meuTime?folhaA:folhaB;
  }
}

/** Reduz suspensões e lesões de todos os times. */
function passarSemana(){
  for(const t of J.times)
    for(const p of t.jogadores){
      if(p.susp>0) p.susp--;
      if(p.lesao>0) p.lesao--;
      p.cartaoVermelho = false;
    }
}

/** Simula todas as partidas da rodada, exceto a do usuário. */
function simularOutros(gA,gB){
  const jogos = J.tabela[J.rodada];
  const res = [];
  for(const [ca,fo] of jogos){
    const A = J.times[ca], B = J.times[fo];
    let x,y;
    if(ca===J.meuTime || fo===J.meuTime){ x=gA; y=gB; }
    else { [x,y] = simularRapido(A,B); }
    aplicarResultado(A,B,x,y);
    res.push({ca,fo,gA:x,gB:y});
  }
  fecharRodadaFinanceiro(jogos);
  J.resultados[J.rodada] = res;
  J.rodada++;
  passarSemana();
  J.times.forEach(t=>{ if(t.id!==J.meuTime) escalarAuto(t); });
  validarEscalacao(meu());
  J.caixaHist.push(meu().cash);
  if(J.rodada>=38) encerrarTemporada();
}

/** Premiação e fim de temporada. */
function encerrarTemporada(){
  const cl = classificacao();
  cl.forEach((t,i)=>{ t.cash += Math.max(1_500_000, 26_000_000 - i*1_100_000); });
  J.fimTemporada = true;
  J.campeao = cl[0].nome;
  J.rebaixados = cl.slice(16).map(t=>t.nome);
  J.minhaPos = posicaoDe(J.meuTime);
}

/** Recomeça o campeonato mantendo elencos (nova temporada). */
function novaTemporada(){
  J.temporada++; J.rodada=0; J.fimTemporada=false;
  J.resultados=[]; J.caixaHist=[];
  J.tabela = gerarTabela(20);
  for(const t of J.times){
    t.pts=t.j=t.v=t.e=t.d=t.gp=t.gc=0;
    for(const p of t.jogadores){
      p.idade++; p.amarelos=0; p.susp=0; p.lesao=0; p.jogos=0; p.gols=0;
      // evolução simples: jovens sobem, veteranos caem
      p.ovr = clamp(p.ovr + (p.idade<24?rnd(0,3): p.idade>32?rnd(-4,0):rnd(-1,2)),40,92);
      p.sal = calcSalario(p.ovr,p.idade); p.val = calcValor(p.ovr,p.idade);
    }
    // aposentadorias: substitui quem passou de 38
    t.jogadores = t.jogadores.map(p => p.idade>38 ? gerarJogador(p.pos, 55+t.tam*4) : p);
    escalarAuto(t);
  }
  tela="painel"; render();
}

const meu = () => J.times[J.meuTime];
const folhaMensal = t => t.jogadores.reduce((s,p)=>s+p.sal,0);

/** Próximo confronto do usuário. */
function proximoJogo(){
  if(J.rodada>=38) return null;
  const j = J.tabela[J.rodada].find(([a,b])=>a===J.meuTime||b===J.meuTime);
  return { casa:J.times[j[0]], fora:J.times[j[1]], mando:j[0]===J.meuTime };
}

/* -------------------------------------------- 6) SALVAR / CARREGAR */
const persistenciaPendente = new Map();
window.addEventListener("message", event=>{
  if(event.origin!==window.location.origin || event.data?.type!=="tecnico-brasil:persistence-result") return;
  const pending = persistenciaPendente.get(event.data.requestId);
  if(!pending) return;
  persistenciaPendente.delete(event.data.requestId);
  if(event.data.ok) pending.resolve(event.data.data); else pending.reject(new Error(event.data.error||"Não foi possível acessar o save."));
});
function solicitarPersistencia(type, payload={}){
  return new Promise((resolve,reject)=>{
    if(window.parent===window) return reject(new Error("O jogo precisa estar dentro da aplicação."));
    const requestId = `${Date.now()}-${Math.random()}`;
    persistenciaPendente.set(requestId,{resolve,reject});
    window.parent.postMessage({type:"tecnico-brasil:"+type,requestId,...payload},window.location.origin);
    setTimeout(()=>{
      if(!persistenciaPendente.has(requestId)) return;
      persistenciaPendente.delete(requestId);
      reject(new Error("Tempo limite ao acessar o banco de dados."));
    },10000);
  });
}
async function salvarJogo(){
  try{
    await solicitarPersistencia("save",{state:J,screen:tela});
    alerta("Jogo salvo no Neon.");
  }catch(e){ alerta("Não foi possível salvar: "+e.message); }
}
async function carregarJogo(){
  try{
    const remote = await solicitarPersistencia("load");
    const raw = remote ? null : localStorage.getItem(CHAVE_SAVE);
    if(!remote && !raw){ alerta("Nenhum jogo salvo encontrado."); return; }
    const d = remote || JSON.parse(raw);
    if(remote){ J = d.state; tela = d.screen==="partida" ? "painel" : d.screen; }
    else { J = d.J; divisaoSelecionada = J.divisao || "A"; tela = d.tela==="partida" ? "painel" : d.tela; }
    divisaoSelecionada = J.divisao || "A";
    render();
    if(remote){ alerta("Jogo carregado do Neon."); return; }
    try{
      await solicitarPersistencia("save",{state:J,screen:tela});
      alerta("Save local migrado para o Neon.");
    }catch(e){ alerta("Save local carregado, mas não foi migrado: "+e.message); }
  }catch(e){ alerta("Save inválido: "+e.message); }
}
function trocarTema(){
  const h = document.documentElement;
  const novo = h.getAttribute("data-tema")==="escuro" ? "claro" : "escuro";
  h.setAttribute("data-tema", novo);
  try{ localStorage.setItem(CHAVE_SAVE+"-tema", novo); }catch(e){}
}

    if(t) document.documentElement.setAttribute("data-tema",t);

})();

function escolherTime(id){

/* --- Tela 3: elenco --- */
function telaElenco(){
  const ordem = ui.ordem || {campo:"ovr", desc:true};
  const ordemPos = {GOL:0,ZAG:1,LAT:2,VOL:3,MEI:4,ATA:5};
  const ps = meu().jogadores.slice().sort((a,b)=>{
    let va=a[ordem.campo], vb=b[ordem.campo];
    if(ordem.campo==="pos"){ va=ordemPos[a.pos]; vb=ordemPos[b.pos]; }
    if(ordem.campo==="nome") return ordem.desc? b.nome.localeCompare(a.nome): a.nome.localeCompare(b.nome);
    return ordem.desc ? vb-va : va-vb;
  });
  const th = (c,n,cls="") => `<th class="${cls}" onclick="ordenar('${c}')">${n}${ordem.campo===c?(ordem.desc?" ▼":" ▲"):""}</th>`;
  return `<div class="card"><h2>Elenco (${ps.length} jogadores)</h2>
   <div class="rol"><table><thead><tr>
     ${th("pos","Pos")}${th("nome","Jogador")}${th("idade","Idade","num")}
     ${th("ovr","Força","num")}${th("sal","Salário","num")}${th("val","Valor","num")}
     ${th("jogos","J","num")}${th("gols","G","num")}<th>Situação</th>
   </tr></thead><tbody>
   ${ps.map(p=>`<tr>
     <td><b>${p.pos}</b></td><td>${esc(p.nome)}</td><td class="num">${p.idade}</td>
     <td class="num"><b>${p.ovr}</b></td><td class="num">${dinheiro(p.sal)}</td>
     <td class="num">${dinheiro(p.val)}</td><td class="num">${p.jogos}</td>
     <td class="num">${p.gols}</td>
     <td>${p.lesao?`<span class="r">Lesão ${p.lesao}r</span>`:
        p.susp?`<span class="r">Suspenso</span>`:
        `<span class="dim">Ok${p.amarelos?` · ${p.amarelos}A`:""}</span>`}</td>
   </tr>`).join("")}
   </tbody></table></div>
   <p class="legenda">Toque no título da coluna para ordenar.</p></div>`;
}
function ordenar(c){
  const o = ui.ordem || {campo:"ovr",desc:true};
  ui.ordem = o.campo===c ? {campo:c,desc:!o.desc} : {campo:c,desc:true};
  render();
}

function telaEscalacao(){
  const t = meu();
  const need = FORMACOES[t.formacao];
  const tits = t.titulares.map(id=>jog(t,id)).filter(Boolean);
  const resto = t.jogadores.filter(p=>!t.titulares.includes(p.id));
  const linha = (p, banco) => `
    <div class="lin ${ui.sel===p.id?'sel':''}" onclick="clicarJogador('${p.id}')">
      <b>${p.pos}</b><span style="flex:1">${esc(p.nome)}</span>

      ${p.lesao?'<span class="r">LES</span>':p.susp?'<span class="r">SUS</span>':''}
    </div>`;
  return `<div class="card">

    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0">
      <span class="dim" style="font-size:13px;font-weight:700">Formação:</span>
      ${Object.keys(FORMACOES).map(f=>
        `<button class="peq ${t.formacao===f?'on':''}" onclick="mudarFormacao('${f}')">${f}</button>`).join(" ")}
      <button class="peq pri" onclick="autoEscalar()" style="margin-left:auto">Escalação automática</button>
    </div>
    <p class="dim">Exigido: ${Object.entries(need).map(([k,v])=>`${v} ${k}`).join(", ")} ·
      Força atual <b>${forcaTime(t).toFixed(1)}</b></p>
  </div>
  <div class="grid">
    <div class="card"><h3>Titulares (${tits.length}/11)</h3>
      <div class="esq">${tits.map(p=>linha(p,false)).join("")}</div></div>
    <div class="card"><h3>Reservas e restante do elenco</h3>
      <div class="esq">${resto.map(p=>linha(p,true)).join("")}</div></div>
  </div>
  <p class="legenda">Toque num jogador e depois em outro para trocá-los de lugar.</p>`;
}
function mudarFormacao(f){ meu().formacao=f; escalarAuto(meu()); render(); }
function autoEscalar(){ escalarAuto(meu()); render(); }
/** Troca dois jogadores de lugar (titular <-> reserva ou entre titulares). */
function clicarJogador(id){
  const t = meu();
  if(!ui.sel){ ui.sel = id; render(); return; }
  if(ui.sel === id){ ui.sel=null; render(); return; }
  const a = ui.sel, b = id;
  const ia = t.titulares.indexOf(a), ib = t.titulares.indexOf(b);
  if(ia>=0 && ib>=0){ t.titulares[ia]=b; t.titulares[ib]=a; }
  else if(ia>=0){
    const p = jog(t,b);
    if(!apto(p)){ ui.sel=null; alerta("Jogador indisponível (lesão ou suspensão)."); return; }
    t.titulares[ia]=b;
  } else if(ib>=0){
    const p = jog(t,a);
    if(!apto(p)){ ui.sel=null; alerta("Jogador indisponível (lesão ou suspensão)."); return; }
    t.titulares[ib]=a;
  }
  ui.sel=null; render();
}

    const metaX = atacarParaDireita ? 798 : 42;
    const metaY = 260 + (Math.random() * 40 - 20);
    campoBola.targetX = metaX;
    campoBola.targetY = metaY;

    const timeAtacante = atacarParaDireita ? campoJogadoresA : campoJogadoresB;
    const timeDefensor = atacarParaDireita ? campoJogadoresB : campoJogadoresA;
    const sinal = atacarParaDireita ? 1 : -1;

    timeAtacante.forEach(p => {
      if(p.pos === "GOL") return;
      p.targetX = clamp(p.baseX + sinal * 170 + (Math.random() * 40 - 20), padX + 50, padX + W - 50);
      p.targetY = clamp(p.baseY + (Math.random() * 30 - 15), padY + 30, padY + H - 30);
    });

    timeDefensor.forEach(p => {
      if(p.pos === "GOL"){
        p.targetX = atacarParaDireita ? 792 : 48;
        p.targetY = metaY;
      } else {
        p.targetX = clamp(p.baseX + sinal * 90 + (Math.random() * 30 - 15), padX + 45, padX + W - 45);
      }
    });

    const nomeTime = evento.lado === "A" ? P.A.nome : P.B.nome;
    const jogObj = evento.jogadorId ? jog(evento.lado === "A" ? P.A : P.B, evento.jogadorId) : null;
    campoCelebracao = {
      texto: `GOL DO ${nomeTime.toUpperCase()}!`,
      subtitulo: jogObj ? `${jogObj.nome} (${jogObj.pos})` : "Golaço!",
      expira: Date.now() + 2500,
      cor: evento.lado === "A" ? P.A.cor : P.B.cor
    };
  } else if(evento.tipo === "chance"){
    const metaX = atacarParaDireita ? 780 : 60;
    const metaY = 260 + (Math.random() * 80 - 40);
    campoBola.targetX = metaX;
    campoBola.targetY = metaY;

    const sinal = atacarParaDireita ? 1 : -1;
    const timeAtacante = atacarParaDireita ? campoJogadoresA : campoJogadoresB;
    const timeDefensor = atacarParaDireita ? campoJogadoresB : campoJogadoresA;

    timeAtacante.forEach(p => {
      if(p.pos === "GOL") return;
      p.targetX = clamp(p.baseX + sinal * 130 + (Math.random() * 30 - 15), padX + 50, padX + W - 50);
    });
    timeDefensor.forEach(p => {
      if(p.pos === "GOL"){
        p.targetY = clamp(metaY, 210, 310);
      } else {
        p.targetX = clamp(p.baseX + sinal * 70, padX + 50, padX + W - 50);
      }
    });
    campoArbitro.targetX = atacarParaDireita ? 620 : 220;
    campoArbitro.targetY = metaY;
  } else if(evento.tipo === "amarelo" || evento.tipo === "vermelho"){
    const pAlvo = [...campoJogadoresA, ...campoJogadoresB].find(p => p.id === evento.jogadorId);
    if(pAlvo){
      pAlvo.cartao = evento.tipo;
      campoBola.targetX = pAlvo.x;
      campoBola.targetY = pAlvo.y;
      campoArbitro.targetX = pAlvo.x + 25;
      campoArbitro.targetY = pAlvo.y + 10;
    }
  } else {
    // Neutro: troca de passes
    const sinal = atacarParaDireita ? 1 : -1;
    const time = atacarParaDireita ? campoJogadoresA : campoJogadoresB;
    const receptor = time.find(p => (p.pos === "MEI" || p.pos === "VOL" || p.pos === "ATA") && Math.random() > 0.4) || time[5];
    campoBola.targetX = receptor.baseX + sinal * (30 + Math.random() * 40);
    campoBola.targetY = receptor.baseY + (Math.random() * 40 - 20);

    [...campoJogadoresA, ...campoJogadoresB].forEach(p => {
      p.targetX = p.baseX + Math.sin(Date.now() / 800 + p.num) * 16;
      p.targetY = p.baseY + Math.cos(Date.now() / 800 + p.num) * 12;
    });
    campoArbitro.targetX = 420 + Math.sin(Date.now() / 900) * 35;
    campoArbitro.targetY = 260 + Math.cos(Date.now() / 900) * 45;
  }
}

function desenharCampo2D(){
  const cv = document.getElementById("campo2d");
  if(!cv) return;
  const ctx = cv.getContext("2d");
  if(!ctx) return;

  const W = 840, H = 520;
  const padX = 40, padY = 32, pitchW = 760, pitchH = 456;
  const tNow = Date.now();

  // Gramado
  ctx.fillStyle = "#277a4a";
  ctx.fillRect(0, 0, W, H);

  // Faixas verticais de corte
  const numFaixas = 10;
  const faixaW = pitchW / numFaixas;
  for(let i = 0; i < numFaixas; i++){
    if(i % 2 === 0){
      ctx.fillStyle = "#2b8450";
      ctx.fillRect(padX + i * faixaW, padY, faixaW, pitchH);
    }
  }

  // Linhas do campo
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = 2;
  ctx.strokeRect(padX, padY, pitchW, pitchH);

  // Meio-campo
  ctx.beginPath();
  ctx.moveTo(420, padY);
  ctx.lineTo(420, padY + pitchH);
  ctx.stroke();

  // Círculo central e ponto
  ctx.beginPath();
  ctx.arc(420, 260, 65, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.beginPath();
  ctx.arc(420, 260, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Linhas tracejadas de quadrantes táticos
  ctx.setLineDash([5, 6]);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
  ctx.beginPath();
  ctx.moveTo(padX + pitchW * 0.28, padY);
  ctx.lineTo(padX + pitchW * 0.28, padY + pitchH);
  ctx.moveTo(padX + pitchW * 0.72, padY);
  ctx.lineTo(padX + pitchW * 0.72, padY + pitchH);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";

  // Área Esquerda
  ctx.strokeRect(padX, 260 - 110, 130, 220);
  ctx.strokeRect(padX, 260 - 55, 45, 110);
  ctx.beginPath();
  ctx.arc(padX + 90, 260, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(padX + 90, 260, 60, -0.85, 0.85);
  ctx.stroke();

  // Área Direita
  ctx.strokeRect(padX + pitchW - 130, 260 - 110, 130, 220);
  ctx.strokeRect(padX + pitchW - 45, 260 - 55, 45, 110);
  ctx.beginPath();
  ctx.arc(padX + pitchW - 90, 260, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(padX + pitchW - 90, 260, 60, Math.PI - 0.85, Math.PI + 0.85);
  ctx.stroke();

  // Escanteios
  const escR = 12;
  ctx.beginPath(); ctx.arc(padX, padY, escR, 0, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(padX + pitchW, padY, escR, Math.PI / 2, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(padX + pitchW, padY + pitchH, escR, Math.PI, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(padX, padY + pitchH, escR, Math.PI * 1.5, Math.PI * 2); ctx.stroke();

  // Traves e redes
  ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
  ctx.strokeRect(padX - 16, 260 - 38, 16, 76);
  ctx.beginPath();
  for(let gy = 260 - 38; gy <= 260 + 38; gy += 10){
    ctx.moveTo(padX - 16, gy); ctx.lineTo(padX, gy);
  }
  ctx.stroke();

  ctx.strokeRect(padX + pitchW, 260 - 38, 16, 76);
  ctx.beginPath();
  for(let gy = 260 - 38; gy <= 260 + 38; gy += 10){
    ctx.moveTo(padX + pitchW, gy); ctx.lineTo(padX + pitchW + 16, gy);
  }
  ctx.stroke();

  // Legenda de arbitragem (como na foto de referência)
  desenharFichaArbitragem(ctx, 55, 16, "A", "#111827", "#ffffff", "Árbitro");
  desenharFichaArbitragem(ctx, 115, 16, "B", "#166534", "#4ade80", "Bandeirinha");
  desenharBandeirinhaLinha(ctx, 420, 16);
  desenharBandeirinhaLinha(ctx, 420, 504);

  // Árbitro A em campo
  campoArbitro.x += (campoArbitro.targetX - campoArbitro.x) * 0.06;
  campoArbitro.y += (campoArbitro.targetY - campoArbitro.y) * 0.06;
  desenharFicha(ctx, campoArbitro.x, campoArbitro.y, "A", "#111827", "#ffffff", 11);

  // Jogadores
  const todosJogadores = [...campoJogadoresA, ...campoJogadoresB];
  todosJogadores.forEach((p, idx) => {
    p.x += (p.targetX - p.x) * 0.08;
    p.y += (p.targetY - p.y) * 0.08;

    const idleX = Math.sin(tNow / 400 + idx) * 1.5;
    const idleY = Math.cos(tNow / 400 + idx) * 1.2;

    const posX = p.x + idleX;
    const posY = p.y + idleY;

    // Sombra
    ctx.beginPath();
    ctx.ellipse(posX, posY + 2, 13, 6, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
    ctx.fill();

    // Ficha/Botão
    desenharJogadorBotao(ctx, posX, posY, p.num, p.cor, p.cartao);
  });

  // Bola ⚽
  campoBola.x += (campoBola.targetX - campoBola.x) * 0.12;
  campoBola.y += (campoBola.targetY - campoBola.y) * 0.12;

  ctx.beginPath();
  ctx.ellipse(campoBola.x, campoBola.y + 3, 5, 2.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(campoBola.x, campoBola.y, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.arc(campoBola.x, campoBola.y, 2, 0, Math.PI * 2);
  ctx.fill();

  // Banner de Comemoração de GOL
  if(campoCelebracao && tNow < campoCelebracao.expira){
    const alpha = Math.min(1, (campoCelebracao.expira - tNow) / 400);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(10, 15, 23, 0.88)";
    ctx.strokeStyle = "#e2bd5b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(W / 2 - 190, H / 2 - 45, 380, 90, 10);
    ctx.fill();
    ctx.stroke();

    ctx.font = "bold 26px 'Space Grotesk', sans-serif";
    ctx.fillStyle = "#facc15";
    ctx.textAlign = "center";
    ctx.fillText(campoCelebracao.texto, W / 2, H / 2 - 8);

    ctx.font = "600 15px 'DM Sans', sans-serif";
    ctx.fillStyle = "#f8fafc";
    ctx.fillText(campoCelebracao.subtitulo, W / 2, H / 2 + 22);
    ctx.restore();
  }
}

function desenharJogadorBotao(ctx, x, y, num, cor, cartao){
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 13.5, 0, Math.PI * 2);
  ctx.fillStyle = cor;
  ctx.fill();
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.font = "bold 11px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(num), x, y + 0.5);

  if(cartao){
    ctx.fillStyle = cartao === "vermelho" ? "#ef4444" : "#facc15";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 0.8;
    ctx.fillRect(x + 8, y - 14, 6, 9);
    ctx.strokeRect(x + 8, y - 14, 6, 9);
  }
  ctx.restore();
}

function desenharFicha(ctx, x, y, texto, corFundo, corTexto, raio){
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, raio, 0, Math.PI * 2);
  ctx.fillStyle = corFundo;
  ctx.fill();
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.font = `bold ${Math.round(raio)}px sans-serif`;
  ctx.fillStyle = corTexto;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(texto, x, y + 0.5);
  ctx.restore();
}

function desenharFichaArbitragem(ctx, x, y, letra, corBg, corTxt, label){
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fillStyle = corBg;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = "bold 9px sans-serif";
  ctx.fillStyle = corTxt;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(letra, x, y + 0.5);

  ctx.font = "600 10px 'DM Sans', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.textAlign = "left";
  ctx.fillText(label, x + 12, y + 3);
  ctx.restore();
}

function desenharBandeirinhaLinha(ctx, x, y){
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fillStyle = "#0f172a";
  ctx.fill();
  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.font = "bold 9px sans-serif";
  ctx.fillStyle = "#22c55e";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("B", x, y + 0.5);

  ctx.strokeStyle = "rgba(34, 197, 94, 0.85)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 14, y); ctx.lineTo(x - 70, y);
  ctx.lineTo(x - 63, y - 3);
  ctx.moveTo(x - 70, y); ctx.lineTo(x - 63, y + 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 14, y); ctx.lineTo(x + 70, y);
  ctx.lineTo(x + 63, y - 3);
  ctx.moveTo(x + 70, y); ctx.lineTo(x + 63, y + 3);
  ctx.stroke();
  ctx.restore();
}

function animarLoopCampo(){
  if(tela !== "partida") return;
  desenharCampo2D();
  campoAnimId = requestAnimationFrame(animarLoopCampo);
}

function iniciarLoopCampo(){
  pararLoopCampo();
  if(!campoJogadoresA.length || !campoJogadoresB.length){
    resetarCampo2D();
  }
  campoAnimId = requestAnimationFrame(animarLoopCampo);
}

function pararLoopCampo(){
  if(campoAnimId){
    cancelAnimationFrame(campoAnimId);
    campoAnimId = null;
  }
}

function pararTimerPartida(){
  if(timerPartida){ clearInterval(timerPartida); timerPartida=null; }
  if(timerIntervalo){ clearTimeout(timerIntervalo); timerIntervalo=null; }
}

function iniciarTimerPartida(){
  pararTimerPartida();
  if(!P || P.fim) return;
  timerPartida = setInterval(()=>{
    if(!P || P.fim || tela!=="partida"){
      pararTimerPartida();
      return;
    }
    if(P.fase === "intervalo"){
      pararTimerPartida();
      timerIntervalo = setTimeout(()=>{
        if(P && !P.fim && P.fase==="intervalo" && tela==="partida"){
          iniciarSegundoTempo();
          iniciarTimerPartida();
        }
      }, 1800);
      return;
    }
    avancar();
    if(P && P.fim){
      pararTimerPartida();
    }
  }, velocidadePartida);
  render();
}

function iniciarPartida(){
  const pj = proximoJogo();
  validarEscalacao(meu());
  if(meu().titulares.length<11){ alerta("Escale 11 jogadores antes de jogar."); return; }
  P = { A:pj.casa, B:pj.fora, placar:{A:0,B:0}, min:0, ev:[], fase:"1t",
        subs:0, lances:null, idx:0, fim:false };
  P.lances = gerarLances(P.A,P.B,1,45);
  P.ev.push({min:1,tipo:"neutro",txt:"<b>Bola rolando!</b> Começa a partida."});
  tela="partida";
  resetarCampo2D();
  render();
  iniciarTimerPartida();
}

/** Avança a narração em blocos de minutos. */
function avancar(){
  if(!P || P.fim) return;
  const passo = 9;
  const limite = P.fase==="1t" ? 45 : 90;
  P.min = Math.min(P.min+passo, limite);
  while(P.idx < P.lances.length && P.lances[P.idx].min <= P.min){
    const lance = P.lances[P.idx++];
    aplicarLance(lance);
    P.ev.push(lance);
  }
  if(P.min>=limite){
    if(P.fase==="1t"){
      P.fase="intervalo";
      P.ev.push({min:45,tipo:"neutro",txt:"<b>Fim do primeiro tempo.</b> Intervalo (preparando o 2º tempo…)"});
      pararTimerPartida();
      render();
      timerIntervalo = setTimeout(()=>{
        if(P && !P.fim && P.fase==="intervalo" && tela==="partida"){
          iniciarSegundoTempo();
          iniciarTimerPartida();
        }
      }, 1800);
      return;
    } else {
      pararTimerPartida();
      finalizarPartida();
    }
  }
  render();
}

function iniciarSegundoTempo(){
  P.fase="2t"; P.min=45; P.idx=0;
  P.lances = gerarLances(P.A,P.B,46,90);
  P.ev.push({min:46,tipo:"neutro",txt:"<b>Começa o segundo tempo!</b>"});
  resetarCampo2D();
  render();
}

function iniciarSegundoTempoManual(){
  pararTimerPartida();
  iniciarSegundoTempo();
  iniciarTimerPartida();
}

function pausarPartida(){
  pararTimerPartida();
  render();
}

function avancarManual(){
  pararTimerPartida();
  if(P.fase==="intervalo"){
    iniciarSegundoTempo();
    iniciarTimerPartida();
  } else {
    avancar();
  }
}

function mudarVelocidade(v){
  velocidadePartida = v;
  if(timerPartida){
    iniciarTimerPartida();
  } else {
    render();
  }
}

function finalizarPartida(){
  P.fim = true;
  pararTimerPartida();
  P.ev.push({min:90,tipo:"neutro",
    txt:`<b>Fim de jogo: ${P.A.nome} ${P.placar.A} x ${P.placar.B} ${P.B.nome}</b>`});
  simularOutros(P.placar.A, P.placar.B);
}

function telaPartida(){
  const podeSub = (P.fase==="intervalo"||P.fase==="2t") && P.subs<3 && !P.fim;
  const rodando = Boolean(timerPartida || timerIntervalo);

  return `<div class="card">
    <h2 style="text-align:center">${esc(P.A.nome)} <span class="dim">x</span> ${esc(P.B.nome)}</h2>
    <div class="placar">${P.placar.A} — ${P.placar.B}</div>
    <p style="text-align:center" class="dim">
      ${P.fim ? "Encerrado" : P.fase==="intervalo" ? "Intervalo (preparando 2º tempo…)" : `${P.min}'`} ·
      substituições usadas: ${P.subs}/3
    </p>

    <!-- CAMPO 2D TÁTICO -->
    <div class="campo-wrapper">
      <canvas id="campo2d" width="840" height="520"></canvas>
    </div>

    <div class="narra" id="narra">
      ${P.ev.map(e=>`<div><span class="min">${e.min}'</span>${e.txt}</div>`).join("") ||
        '<div class="dim">A bola vai rolar…</div>'}
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${P.fim
        ? `<button class="pri" onclick="irPara('painel')">Voltar ao painel</button>
           <button onclick="irPara('tabela')">Ver classificação</button>`
        : `
           ${rodando
             ? `<button class="peq" onclick="pausarPartida()">⏸ Pausar</button>`
             : `<button class="pri peq" onclick="iniciarTimerPartida()">▶ Continuar partida</button>`}
           ${P.fase==="intervalo"
             ? `<button class="pri peq" onclick="iniciarSegundoTempoManual()">Começar 2º tempo agora</button>
                ${Object.keys(FORMACOES).map(f=>`<button class="peq ${meu().formacao===f?'on':''}" onclick="formacaoIntervalo('${f}')">${f}</button>`).join("")}`
             : `<button class="peq" onclick="avancarManual()">+ Avançar lance</button>`}
           <button class="peq" onclick="jogarTudo()" title="Finalizar e ver resultado imediato">⚡ Simular direto</button>
           <div style="margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;" class="dim">
             <span>Velocidade:</span>
             <button class="peq ${velocidadePartida===650?'on':''}" onclick="mudarVelocidade(650)">1x</button>
             <button class="peq ${velocidadePartida===250?'on':''}" onclick="mudarVelocidade(250)">2x</button>
           </div>
          `}
    </div>
    ${podeSub?painelSubs():""}
  </div>`;
}

function formacaoIntervalo(f){ meu().formacao=f; escalarAuto(meu()); resetarCampo2D(); render(); }

function jogarTudo(){
  pararTimerPartida();
  let guarda=0;
  while(!P.fim && guarda++<60){
    if(P.fase==="intervalo") iniciarSegundoTempo();
    else avancar();
  }
  render();
}
function painelSubs(){
  const t = meu();
  const dentro = t.titulares.map(id=>jog(t,id)).filter(Boolean);
  const fora = t.jogadores.filter(p=>!t.titulares.includes(p.id) && apto(p));
  return `<div class="card" style="margin-top:12px">
    <h3>Substituições (${P.subs}/3)</h3>
    <div class="grid">
      <div><h4 class="dim">Sai</h4><div class="esq">
        ${dentro.map(p=>`<div class="lin ${ui.sai===p.id?'sel':''}" onclick="marcarSai('${p.id}')">
          <b>${p.pos}</b><span style="flex:1">${esc(p.nome)}</span><b>${p.ovr}</b></div>`).join("")}
      </div></div>
      <div><h4 class="dim">Entra</h4><div class="esq">
        ${fora.map(p=>`<div class="lin" onclick="fazerSub('${p.id}')">
          <b>${p.pos}</b><span style="flex:1">${esc(p.nome)}</span><b>${p.ovr}</b></div>`).join("")}
      </div></div>
    </div></div>`;
}
function marcarSai(id){ ui.sai=id; render(); }
function fazerSub(idEntra){
  if(!ui.sai){ alerta("Escolha primeiro quem sai."); return; }
  if(P.subs>=3){ alerta("Você já usou as 3 substituições."); return; }
  const t = meu();
  const i = t.titulares.indexOf(ui.sai);
  if(i<0){ ui.sai=null; render(); return; }
  const sai = jog(t,ui.sai), entra = jog(t,idEntra);
  t.titulares[i] = idEntra;
  P.subs++; ui.sai=null;
  P.ev.push({min:Math.max(P.min,45),tipo:"neutro",
    txt:`<b>Substituição:</b> sai ${sai.nome}, entra ${entra.nome}.`});
  render();
}

/* --- Tela 6: classificação --- */
function telaTabela(){
  const cl = classificacao();
  return `<div class="card"><h2>Classificação · Temporada ${J.temporada}</h2>
  <div class="rol"><table><thead><tr><th>#</th><th>Time</th>
    <th class="num">P</th><th class="num">J</th><th class="num">V</th><th class="num">E</th>
    <th class="num">D</th><th class="num">GP</th><th class="num">GC</th><th class="num">SG</th>
  </tr></thead><tbody>
  ${cl.map((t,i)=>{
    const zona = i===0?"zt": i<6?"zl": i>=16?"zr":"";
    return `<tr class="${zona} ${t.id===J.meuTime?'sel':''}">
      <td>${i+1}</td>
      <td><span class="pill" style="background:${t.cor}">${t.sigla}</span> ${esc(t.nome)}</td>
      <td class="num"><b>${t.pts}</b></td><td class="num">${t.j}</td><td class="num">${t.v}</td>
      <td class="num">${t.e}</td><td class="num">${t.d}</td><td class="num">${t.gp}</td>
      <td class="num">${t.gc}</td><td class="num">${t.gp-t.gc}</td></tr>`;
  }).join("")}
  </tbody></table></div>
  <p class="legenda">Barra verde = título · azul = Libertadores (2º ao 6º) · vermelha = rebaixamento (17º ao 20º)</p>
  </div>`;
}

/* --- Tela 7: mercado --- */
function telaMercado(){
  const t = meu();
  const filtro = ui.filtroPos || "TODAS";
  let lista = [];
  for(const o of J.times){
    if(o.id===J.meuTime) continue;
    for(const p of o.jogadores) lista.push({p, dono:o});
  }
  if(filtro!=="TODAS") lista = lista.filter(x=>x.p.pos===filtro);
  lista.sort((a,b)=>b.p.ovr-a.p.ovr);
  lista = lista.slice(0,60);

  return `<div class="card">
    <h2>Mercado de transferências</h2>
    <p>Caixa: <b class="${t.cash<0?'neg':''}">${dinheiro(t.cash)}</b> ·
       Elenco: ${t.jogadores.length} (mín. 16, máx. 28)</p>
    <p>${["TODAS",...POSICOES].map(f=>
      `<button class="peq ${filtro===f?'on':''}" onclick="filtrarPos('${f}')">${f}</button>`).join(" ")}</p>
  </div>
  <div class="card"><h3>Comprar</h3>
   <div class="rol"><table><thead><tr><th>Pos</th><th>Jogador</th><th>Clube</th>
     <th class="num">Idade</th><th class="num">Força</th><th class="num">Salário</th>
     <th class="num">Preço</th><th></th></tr></thead><tbody>
   ${lista.map(({p,dono})=>`<tr>
     <td><b>${p.pos}</b></td><td>${esc(p.nome)}</td><td class="dim">${dono.sigla}</td>
     <td class="num">${p.idade}</td><td class="num"><b>${p.ovr}</b></td>
     <td class="num">${dinheiro(p.sal)}</td><td class="num">${dinheiro(p.val)}</td>
     <td><button class="peq ${t.cash>=p.val?'pri':''}" ${t.cash<p.val?'disabled':''}
       onclick="comprar(${dono.id},'${p.id}')">Comprar</button></td></tr>`).join("")}
   </tbody></table></div></div>
  <div class="card"><h3>Vender (recebe 90% do valor)</h3>
   <div class="rol"><table><thead><tr><th>Pos</th><th>Jogador</th><th class="num">Idade</th>
     <th class="num">Força</th><th class="num">Recebe</th><th></th></tr></thead><tbody>
   ${t.jogadores.slice().sort((a,b)=>b.val-a.val).map(p=>`<tr>
     <td><b>${p.pos}</b></td><td>${esc(p.nome)}</td><td class="num">${p.idade}</td>
     <td class="num"><b>${p.ovr}</b></td><td class="num">${dinheiro(p.val*0.9)}</td>
     <td><button class="peq" onclick="vender('${p.id}')">Vender</button></td></tr>`).join("")}
   </tbody></table></div></div>`;
}
function filtrarPos(f){ ui.filtroPos=f; render(); }
function comprar(donoId,pid){
  const t = meu(), dono = J.times[donoId];
  const p = jog(dono,pid);
  if(!p) return;
  if(t.cash < p.val){ alerta("Caixa insuficiente."); return; }
  if(t.jogadores.length>=28){ alerta("Elenco cheio (máximo 28)."); return; }
  if(dono.jogadores.length<=16){ alerta(`${dono.nome} não pode vender: elenco mínimo.`); return; }
  dono.jogadores = dono.jogadores.filter(x=>x.id!==pid);
  dono.titulares = dono.titulares.filter(x=>x!==pid);
  escalarAuto(dono);
  t.cash -= p.val; dono.cash += p.val;
  t.jogadores.push(p);
  alerta(`${p.nome} contratado por ${dinheiro(p.val)}.`);
}
function vender(pid){
  const t = meu(); const p = jog(t,pid);
  if(!p) return;
  if(t.jogadores.length<=16){ alerta("Elenco mínimo de 16 jogadores."); return; }
  const comprador = J.times.filter(o=>o.id!==t.id && o.cash>=p.val && o.jogadores.length<28);
  const dono = comprador.length ? sort(comprador) : null;
  if(!dono){ alerta("Nenhum clube tem caixa para esse jogador agora."); return; }
  t.jogadores = t.jogadores.filter(x=>x.id!==pid);
  t.titulares = t.titulares.filter(x=>x!==pid);
  t.reservas = t.reservas.filter(x=>x!==pid);
  dono.jogadores.push(p); dono.cash -= p.val;
  t.cash += p.val*0.9;
  validarEscalacao(t); escalarAuto(dono);
  alerta(`${p.nome} vendido ao ${dono.nome} por ${dinheiro(p.val*0.9)}.`);
}

/* --- Tela 8: finanças --- */
function telaFinancas(){
  const t = meu();
  const folha = folhaMensal(t);
  const pos = posicaoDe(J.meuTime);
  const premio = Math.max(1_500_000, 26_000_000 - (pos-1)*1_100_000);
  return `<div class="card"><h2>Finanças</h2>
    <div class="grid">
      <div><p class="dim">Caixa atual</p>
        <h1 class="${t.cash<0?'neg':''}">${dinheiro(t.cash)}</h1></div>
      <div><p class="dim">Folha salarial mensal</p><h1>${dinheiro(folha)}</h1>
        <p class="dim">Cobrança semanal: ${dinheiro(folha/4)} por rodada</p></div>
    </div>
    ${t.cash<0?`<div class="aviso">Caixa negativo. Venda jogadores ou dispense salários altos.</div>`:""}
  </div>
  <div class="card"><h3>Últimos lançamentos</h3>
    <table><tbody>
      <tr><td>Bilheteria (último jogo em casa)</td><td class="num">${dinheiro(J.ultRenda||0)}</td></tr>
      <tr><td>Salários (última rodada)</td><td class="num neg">${dinheiro(-(J.ultFolha||folha/4))}</td></tr>
      <tr><td>Premiação estimada (${pos}º lugar)</td><td class="num">${dinheiro(premio)}</td></tr>
    </tbody></table>
  </div>
  <div class="card"><h3>Maiores salários do elenco</h3>
    <div class="rol"><table><thead><tr><th>Jogador</th><th>Pos</th>
      <th class="num">Força</th><th class="num">Salário</th></tr></thead><tbody>
      ${t.jogadores.slice().sort((a,b)=>b.sal-a.sal).slice(0,10).map(p=>`<tr>
        <td>${esc(p.nome)}</td><td><b>${p.pos}</b></td><td class="num">${p.ovr}</td>
        <td class="num">${dinheiro(p.sal)}</td></tr>`).join("")}
    </tbody></table></div></div>
  <div class="card"><h3>Evolução do caixa</h3>
    <p class="dim">${J.caixaHist.map(v=>dinheiro(v)).slice(-10).join(" → ") || "sem histórico"}</p></div>`;
}

function telaFimTemporada(){
  const cl = classificacao();
  return `<div class="card">
    <h1>Fim da temporada ${J.temporada}</h1>
    <p>Campeão: <b>${esc(J.campeao)}</b></p>
    <p>Sua posição final: <b>${J.minhaPos}º</b> com ${meu().pts} pontos</p>
    <p>Rebaixados: ${J.rebaixados.map(esc).join(", ")}</p>

  </div>
  <div class="card"><h3>Artilheiros do seu time</h3>
    <table><tbody>${meu().jogadores.slice().sort((a,b)=>b.gols-a.gols).slice(0,5)
      .map(p=>`<tr><td>${esc(p.nome)}</td><td class="num"><b>${p.gols}</b> gols</td></tr>`).join("")}
    </tbody></table></div>`;
}
